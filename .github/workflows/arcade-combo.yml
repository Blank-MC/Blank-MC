name: Generate Arcade Graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Paksa kasih izin nulis ke sistem biar gak pernah ada error permission lagi
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 1. Siapin area kerja
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pacman kerja di folder 'dist'
      - name: Generate Pacman Graph 🍒
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Blank-MC

      # 3. Ular kerja di folder 'snake-temp'
      - name: Generate Snake Graph 🐍
        uses: Platane/snk@v3
        with:
          github_user_name: Blank-MC
          outputs: |
            snake-temp/snake-dark.svg?palette=github-dark

      # 4. Pindahin Ular, lalu ubah hak milik file (Fix Error 128)
      - name: Gabungkan File & Fix Ownership
        run: |
          sudo cp snake-temp/snake-dark.svg dist/
          sudo chown -R $USER:$USER dist/

      # 5. Upload semuanya pakai mesin versi terbaru (Fix Warning Kuning)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
