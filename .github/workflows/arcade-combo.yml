name: Generate Arcade Graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 1. Bikin folder dist dan kasih izin penuh biar mesin nggak berantem (Fix Permission Denied)
      - name: Setup Output Folder
        run: |
          mkdir -p dist
          sudo chmod 777 dist

      # 2. Bikin gambar Pacman (Otomatis nama file-nya: pacman-contribution-graph.svg)
      - name: Generate Pacman Graph 🍒
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Blank-MC

      # 3. Bikin gambar Ular (Nama file: snake-dark.svg)
      - name: Generate Snake Graph 🐍
        uses: Platane/snk@v3
        with:
          github_user_name: Blank-MC
          outputs: |
            dist/snake-dark.svg?palette=github-dark

      # 4. Upload dua-duanya ke branch 'output'
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
